# meta-nvrec: FPGA Drive NVMe-offload recorder layer (nvrec kernel driver,
# recorder apps, kernel config fragment, image additions). Enabled per target
# by listing Yocto/meta-nvrec in Yocto/bsp/<target>/bblayers-extra.txt.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-nvrec"
BBFILE_PATTERN_meta-nvrec = "^${LAYERDIR}/"
# Below meta-user (7) so a board's meta-user can override anything here.
BBFILE_PRIORITY_meta-nvrec = "6"
LAYERSERIES_COMPAT_meta-nvrec = "scarthgap"
LAYERDEPENDS_meta-nvrec = "core openembedded-layer filesystems-layer"

# Repo root (Yocto/meta-nvrec/../..): the recipes take their sources from
# sw/ and include/ in this repository rather than from a fetched tarball.
NVREC_REPO_ROOT := "${@os.path.normpath(os.path.join('${LAYERDIR}', '..', '..'))}"
