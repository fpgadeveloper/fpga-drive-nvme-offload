# Installed by nvrec-mod (meta-nvrec). The SSDs behind the FPGA's PCIe root
# ports belong to the nvrec driver (/dev/nvrecXn1, hardware recorder). Do not
# let udev autoload the stock nvme driver: it would claim any SSD nvrec has
# released and reset the controller under the NVMe Host Accelerator.
# For a reference test with the stock driver:
#   echo <pci-address> > /sys/bus/pci/drivers/nvrec-nvme/unbind
#   modprobe nvme            # binds every NVMe device no driver holds
# and back:
#   echo <pci-address> > /sys/bus/pci/drivers/nvme/unbind
#   echo <pci-address> > /sys/bus/pci/drivers/nvrec-nvme/bind
blacklist nvme
