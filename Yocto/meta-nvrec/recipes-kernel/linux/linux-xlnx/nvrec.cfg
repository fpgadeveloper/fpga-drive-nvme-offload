# FPGA Drive NVMe-offload recorder kernel configuration fragment

# The stock NVMe driver as a module (blacklisted by nvrec-mod): a built-in
# nvme would bind the SSDs before nvrec.ko is loaded. Kept available for
# reference tests (modprobe nvme after unbinding an SSD from nvrec).
CONFIG_NVME_CORE=m
CONFIG_BLK_DEV_NVME=m
# CONFIG_NVME_TARGET is not set

# blk-mq block devices /dev/nvrecXn1
CONFIG_BLK_DEV=y

# Contiguous recording ring (driver-allocated, default 256 MB): CMA, sized
# on the kernel command line (cma=, bsp conf/local.conf.append)
CONFIG_CMA=y
CONFIG_DMA_CMA=y

# Optional user hugepage rings (accepted only when physically contiguous)
CONFIG_HUGETLBFS=y
CONFIG_HUGETLB_PAGE=y

# RAID0 across two SSDs (nvsetup-raid0.sh), md layout = hardware stripe
CONFIG_MD=y
CONFIG_BLK_DEV_MD=y
CONFIG_MD_RAID0=y

# exFAT, the recording filesystem (contiguous preallocated files)
CONFIG_EXFAT_FS=y
CONFIG_EXFAT_DEFAULT_IOCHARSET="utf8"
CONFIG_NLS_UTF8=y
