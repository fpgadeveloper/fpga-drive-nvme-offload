# FPGA Drive FMC configs (Versal: QDMA Subsystem for PCIe in PL)

CONFIG_PCI_REALLOC_ENABLE_AUTO=y
CONFIG_PCIE_XDMA_PL=y
CONFIG_PCIE_XILINX_DMA_PL=y
CONFIG_PCIE_XILINX_CPM=y
# The stock NVMe driver is a MODULE here (not =y as in the base design): the
# nvrec driver owns the SSDs (meta-nvrec nvrec.cfg, blacklist in nvrec-mod)
CONFIG_NVME_CORE=m
CONFIG_BLK_DEV_NVME=m
